name: Deploy news dashboard to GitHub Pages

on:
  push:
    # The feature-branch trigger lets Pages go live before the PR merges;
    # it is inert once the branch is deleted and can be dropped after merge.
    branches: [master, claude/live-news-dashboard-1u4ue7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: news-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
