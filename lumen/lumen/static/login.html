<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen · Sign in</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .login { width: min(380px, 100%); text-align: center; padding: 32px 26px; }
    .login .brand { justify-content: center; margin-bottom: 18px; }
    .pin { letter-spacing: .5em; text-align: center; font-size: 26px; height: 58px; }
    .login p { color: var(--muted); }
    .err { color: #e5484d; min-height: 1.5em; margin: 10px 0 0; }
  </style>
</head>
<body>
  <form class="panel login" id="f">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Lumen</span></div>
    <h2 style="margin:0 0 6px">Welcome back</h2>
    <p>Enter the PIN shown on your computer under <em>Sources → Phone access</em>.</p>
    <input class="input pin" id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" autofocus aria-label="PIN">
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Open my photos</button>
  </form>
  <script>
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: document.getElementById("pin").value }) });
      if (r.ok) { location.href = "/"; return; }
      const d = await r.json().catch(() => ({}));
      document.getElementById("err").textContent = d.detail || "That didn't work";
      document.getElementById("pin").select();
    };
  </script>
</body>
</html>
